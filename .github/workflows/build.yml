name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prevent any 'stty' TTY-related errors:
      TERM: dumb
      # Point Buildozer at its own SDK/NDK installs:
      ANDROIDSDK: ${{ runner.workspace }}/.buildozer/android/platform/android-sdk
      ANDROIDNDK: ${{ runner.workspace }}/.buildozer/android/platform/android-ndk-r25b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache Buildozer global
        uses: actions/cache@v3
        with:
          path: $HOME/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install native & Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential zip unzip \
            libsdl2-dev libswscale-dev libavformat-dev libavcodec-dev \
            libunwind-dev zlib1g-dev libsqlite3-dev libffi-dev libncurses5-dev
          python -m pip install --upgrade pip
          pip install --user cython buildozer

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --sdk_root=$ANDROIDSDK --licenses || true

      - name: Add pip binaries to PATH
        run: echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Build the APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: bin/*.apk
